<div class="form-container fade-in-up">
    <h3 class="title">💰 Добавить покупку</h3>
    <p class="subtitle">Клиент: <strong>{{ client?.full_name }}</strong></p>

    <form (ngSubmit)="submit()">
        <div class="field">
            <label>Сумма покупки (₽)</label>
            <input type="number" [(ngModel)]="form.amount" name="amount" required min="1" step="0.01"
                placeholder="5000" />
        </div>

        <div class="field">
            <label>Номер заказа (необязательно)</label>
            <input type="text" [(ngModel)]="form.order_number" name="order_number" placeholder="#12345" />
        </div>

        <div class="field">
            <label>Комментарий</label>
            <textarea [(ngModel)]="form.comment" name="comment" rows="2" placeholder="Примечание..."></textarea>
        </div>

        @if (form.amount > 0) {
        <div class="preview">
            <div>Комиссия ({{ getRate() }}%):</div>
            <div class="commission">{{ getCommission() | number:'1.0-2' }} ₽</div>
        </div>
        }

        <button type="submit" class="submit-btn" [disabled]="form.amount <= 0">
            ✓ Сохранить покупку
        </button>
    </form>
</div>
